# cargo-make tasks. Run with `cargo make <task>`.

[config]
default_to_workspace = false

[tasks.release]
clear = true
description = "Release build of the nitpick launcher"
command = "cargo"
args = ["build", "-p", "nitpick-app", "--release"]

# windeployqt and macdeployqt have no counterpart on Linux.
[tasks.package]
clear = true
description = "Self-contained package of the nitpick launcher for the host OS"
windows_alias = "package-windows"
mac_alias = "package-macos"
script = '''
echo "package: not supported on this OS" >&2
exit 1
'''

# Package scripts and files are in crates/nitpick-app/packaging/.
[tasks.package-windows]
clear = true
description = "Self-contained Windows folder and zip archive (windeployqt)"
condition = { platforms = ["windows"] }
dependencies = ["release"]
command = "powershell"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "crates/nitpick-app/packaging/windows/package.ps1"]

[tasks.package-macos]
clear = true
description = "Self-contained macOS app bundle and zip archive (macdeployqt)"
condition = { platforms = ["mac"] }
dependencies = ["release"]
command = "bash"
args = ["crates/nitpick-app/packaging/macos/package.sh"]
