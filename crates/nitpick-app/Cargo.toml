[package]
name = "nitpick-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Qt launcher and HDR10 full-screen display for nitpick test patterns"

[[bin]]
name = "nitpick"
path = "src/main.rs"

[dependencies]
async-task = "4.7.1"
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
dirs = "7.0.0"
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
nitpick-core = { path = "../nitpick-core" }
nitpick-display = { path = "../nitpick-display", features = ["x11"] }
nitpick-test-host = { path = "../nitpick-test-host", features = ["device"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
nitpick-capture = { path = "../nitpick-capture" }

[build-dependencies]
cxx-qt-build = "0.10.0"

[lints]
workspace = true

[dev-dependencies]
nitpick-fixtures = { path = "../nitpick-fixtures" }
nitpick-test-host = { path = "../nitpick-test-host", features = ["contract"] }
serde_json = "1"
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
half = "2.7.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
