[package]
name = "nitpick-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Qt launcher and HDR10 full-screen display for nitpick test patterns"

[[bin]]
name = "nitpick"
path = "src/main.rs"

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
nitpick-core = { path = "../nitpick-core" }
nitpick-display = { path = "../nitpick-display" }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10.0"

[lints]
workspace = true
