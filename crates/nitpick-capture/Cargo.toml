[package]
name = "nitpick-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OS capture adapters of the nitpick test hosts"
publish = false

# The frame conversion is portable, so its tests run on each OS. The
# Windows Graphics Capture session is Windows only.
[dependencies]
nitpick-test-host = { path = "../nitpick-test-host" }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
futures-channel = "0.3.34"
futures-core = "0.3.34"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
half = "2.7.1"
nitpick-core = { path = "../nitpick-core" }

[lints]
workspace = true
