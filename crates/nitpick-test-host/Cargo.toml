[package]
name = "nitpick-test-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "JSON-lines test-host protocol shared by the nitpick hosts"
publish = false

[features]
# The shared host contract with a mock driver, for the executor tests of
# each host.
contract = []

# No executor, GUI or server: each host polls the controller with its own
# executor. The command-line host builds this crate without a window system.
[dependencies]
futures-channel = "0.3.34"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
half = "2.7.1"
nitpick-core = { path = "../nitpick-core" }
nitpick-fixtures = { path = "../nitpick-fixtures" }
serde = { version = "1.0.229", features = ["derive"] }
# Artifacts store chromaticities and luminance as decimals; the default
# parser can be one ULP off.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[lints]
workspace = true
