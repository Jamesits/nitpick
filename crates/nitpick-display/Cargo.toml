[package]
name = "nitpick-display"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native display device enumeration and profile control for nitpick"

[dependencies]
md-5 = "0.11.0"
nitpick-core = { path = "../nitpick-core", features = ["serde"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15.0"
rustix = { version = "1.1.6", features = ["process"] }
zbus = { version = "6.2.1", default-features = false, features = [
    "default-rt",
    "proxy",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSScreen",
    "objc2-core-foundation",
] }
objc2-color-sync = { version = "0.3.2", default-features = false, features = [
    "std",
    "ColorSyncDevice",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFUUID",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "libc",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSString",
    "NSValue",
] }

[lints]
workspace = true
