[package]
name = "nitpick-display"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native display device enumeration and profile control for nitpick"

[dependencies]
nitpick-core = { path = "../nitpick-core", features = ["serde"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

[lints]
workspace = true
