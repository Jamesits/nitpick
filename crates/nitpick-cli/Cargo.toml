[package]
name = "nitpick-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line host of the nitpick browser output"

# No Qt, Tauri or nitpick-app: this host runs without a window system.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nitpick-browser = { path = "../nitpick-browser" }
nitpick-core = { path = "../nitpick-core" }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true
