[package]
name = "nitpick-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reader for the checked-in output test fixtures"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# The fixtures store shortest round-trip decimals; the default parser can
# be one ULP off.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
