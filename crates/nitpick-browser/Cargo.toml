[package]
name = "nitpick-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser output driver and HTTP/WebSocket service for nitpick"

# No Qt, Tauri or nitpick-app here: the command-line host builds this
# crate without a window system.
[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
getrandom = "0.4.3"
nitpick-core = { path = "../nitpick-core" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
crc32fast = "1.5.4"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
zune-png = "0.5.2"

[lints]
workspace = true
