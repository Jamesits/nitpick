[package]
name = "nitpick-webview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Optional local webview window for the nitpick browser output"

# A separate process: the browser service and the command-line host do not
# depend on this crate.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6"] }

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false }

[lints]
workspace = true
